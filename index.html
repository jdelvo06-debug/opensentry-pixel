<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="OpenSentry Pixel, a retro arcade C-UAS defense game."
    />
    <title>OpenSentry Pixel</title>
  </head>
  <body>
    <main id="app">
      <section id="cabinet">
        <div id="game-shell">
          <div id="hud" aria-live="polite">
            <div class="hud-row">
              <span id="score">SCORE 000000</span>
              <span id="high-score">HIGH 000000</span>
              <span id="wave">WAVE 1</span>
              <span id="health">BASE 100%</span>
            </div>
            <div class="hud-row compact">
              <span id="weapon">LASER</span>
              <button id="laser" class="weapon-button" type="button" data-weapon="laser">HEAT 0%</button>
              <button id="missile" class="weapon-button" type="button" data-weapon="missile">MISSILES 3/3</button>
              <button id="jammer" class="weapon-button" type="button" data-weapon="jammer">JAM READY</button>
              <button id="hpm" class="weapon-button" type="button" data-weapon="hpm">HPM READY</button>
            </div>
            <div class="hud-row message">
              <span id="message">DETECT. TRACK. IDENTIFY. DELETE.</span>
            </div>
          </div>
          <div id="game-container"></div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
